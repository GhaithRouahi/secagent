[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secagent"
version = "0.1.0"
description = "Linux host-based intrusion detection and response agent (process, file, network, auth monitoring)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SecAgent contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
secagentd = "secagent.daemon.main:main"
secagentctl = "secagent.cli.secagentctl:main"

[tool.setuptools.packages.find]
include = ["secagent*"]

[tool.setuptools.package-data]
"secagent.policy" = ["*.yaml"]
"secagent.dashboard" = ["static/*"]
"secagent.daemon" = ["bpf/*.bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "root: test requires root privileges",
    "ebpf: test requires a working bpftrace/eBPF environment",
    "linux: test requires Linux kernel interfaces (/proc, inotify)",
]
