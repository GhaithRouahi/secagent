# SecAgent default policy
# Installed to /etc/secagent/policy.yaml. Reload after editing:  secagentctl policy reload
#
# Rule fields
#   id, description, severity (low|medium|high|critical), mitre (ATT&CK technique id)
#   match:     field -> value (equality) | [list] (any of) | {operator: value}
#              operators: eq ne in not_in contains not_contains startswith not_startswith
#                         endswith glob not_glob regex not_regex gt gte lt lte cidr not_cidr exists
#   threshold: {count, window (s), group_by: [fields], distinct: field, cooldown (s)}
#   action:    alert | kill_process | block_ip   (destructive actions also need
#              response.enabled: true below - see "Active response")
#   message:   python format string over event fields, e.g. "{parent_name} -> {child_name}"
version: 1

settings:
  record_events: true      # keep raw events in SQLite (powers `secagentctl tail` history / dashboard)
  max_events: 100000       # raw-event retention; alerts are never pruned

monitors:
  process:
    enabled: true
    backend: auto          # auto | ebpf | proc
    poll_interval: 0.2     # /proc fallback only

  file:
    enabled: true
    backend: auto          # auto | inotify | poll
    debounce: 0.2          # seconds to coalesce bursts of writes before re-hashing
    rescan_interval: 300   # full re-hash safety net (inotify overflow, late-created dirs)
    max_hash_size: 104857600
    watch:
      # identity & privilege
      - {path: /etc/passwd, group: identity}
      - {path: /etc/shadow, group: identity}
      - {path: /etc/group, group: identity}
      - {path: /etc/gshadow, group: identity}
      - {path: /etc/sudoers, group: identity}
      - {path: /etc/sudoers.d, group: identity}
      # remote access
      - {path: /etc/ssh, group: ssh, recursive: true}
      - {path: /root/.ssh, group: ssh}
      # persistence
      - {path: /etc/crontab, group: persistence}
      - {path: /etc/cron.d, group: persistence}
      - {path: /var/spool/cron/crontabs, group: persistence}
      - {path: /etc/systemd/system, group: persistence, recursive: true}
      - {path: /etc/ld.so.preload, group: preload}   # usually absent: creation = rootkit
      # protected binaries (common trojan targets)
      - {path: /usr/bin/sudo, group: binaries}
      - {path: /usr/bin/su, group: binaries}
      - {path: /usr/bin/passwd, group: binaries}
      - {path: /usr/bin/login, group: binaries}
      - {path: /usr/sbin/sshd, group: binaries}
      - {path: /usr/bin/ssh, group: binaries}
      - {path: /usr/bin/ps, group: binaries}
      - {path: /usr/bin/ls, group: binaries}
      - {path: /usr/bin/ss, group: binaries}
      - {path: /usr/bin/netstat, group: binaries}
      - {path: /usr/bin/bash, group: binaries}

  network:
    enabled: true
    backend: auto          # auto | ebpf | proc
    poll_interval: 0.5     # /proc/net fallback only

rules:
  # ------------------------------------------------------------------ process execution
  - id: suspicious-shell-from-webserver
    description: A network-facing service spawned a shell or network tool (web shell / RCE)
    mitre: T1505.003
    severity: high
    match:
      event_type: process_exec
      parent_name: [nginx, apache2, httpd, lighttpd, caddy, php-fpm, php-fpm8.1, php-fpm8.2,
                    php-fpm8.3, tomcat, java, node, uwsgi, gunicorn, postgres, mysqld, redis-server]
      child_name: [sh, bash, dash, zsh, ksh, csh, tcsh, fish, nc, ncat, netcat, socat, telnet]
    message: "{parent_name} (pid {ppid}) spawned {child_name} (pid {pid}): {cmdline}"

  - id: exec-from-temp-dir
    description: Binary executed from a world-writable temp directory
    mitre: T1059
    severity: high
    match:
      event_type: process_exec
      exe: {startswith: [/tmp/, /var/tmp/, /dev/shm/, /run/shm/]}
    message: "Executed from temp dir: {exe} (pid {pid}, uid {uid}, parent {parent_name})"

  - id: privilege-escalation-to-root
    description: Process gained root (euid 0) across exec from a non-root parent
    mitre: T1068
    severity: high
    match:
      event_type: process_exec
      privilege_escalation: true
      child_name:
        not_in: [sudo, su, passwd, chsh, chfn, newgrp, gpasswd, mount, umount, fusermount,
                 fusermount3, unix_chkpwd, ping, ping6, ssh-keysign, Xorg, dbus-daemon-launch,
                 polkit-agent-he, chrome-sandbox, snap-confine, ntfs-3g]
    message: "{child_name} (pid {pid}) is running as root (euid 0) but its parent {parent_name} had euid {parent_euid}"

  - id: reverse-shell-cmdline
    description: Command line matches a classic reverse-shell pattern
    mitre: T1059.004
    severity: critical
    action: kill_process     # only executes if response.enabled is true
    match:
      event_type: process_exec
      cmdline:
        regex: ['/dev/(tcp|udp)/', '\b(nc|ncat|netcat)\b.*\s-(e|c)\s', 'bash\s+-i\s*>&',
                'socat\b.*exec:', 'mkfifo\s.*\b(nc|ncat|sh)\b',
                'python[0-9.]*\s+-c\s.*socket.*(subprocess|pty|dup2)']
    message: "Reverse shell pattern in pid {pid} ({child_name}): {cmdline}"

  - id: exec-deleted-binary
    description: Process running from a binary that was deleted from disk (fileless / cleanup)
    mitre: T1070.004
    severity: medium
    match:
      event_type: process_exec
      exe_deleted: true
    message: "{child_name} (pid {pid}) runs from deleted file {exe}"

  # ------------------------------------------------------------------ file integrity
  - id: identity-file-changed
    description: Account / privilege database changed (passwd, shadow, group, sudoers)
    mitre: T1098
    severity: high
    match: {event_type: file_change, group: identity}
    message: "{path} {change} (sha256 {old_hash} -> {new_hash}, mode {old_mode} -> {new_mode})"

  - id: ssh-config-or-keys-changed
    description: SSH daemon config or root authorized_keys changed (backdoor access)
    mitre: T1098.004
    severity: high
    match: {event_type: file_change, group: ssh}
    message: "{path} {change} (sha256 {old_hash} -> {new_hash})"

  - id: persistence-location-changed
    description: Cron or systemd unit changed (persistence)
    mitre: T1053.003
    severity: high
    match: {event_type: file_change, group: persistence}
    message: "{path} {change} (sha256 {old_hash} -> {new_hash})"

  - id: ld-preload-tampering
    description: /etc/ld.so.preload created or changed (userland rootkit technique)
    mitre: T1574.006
    severity: critical
    match: {event_type: file_change, group: preload}
    message: "{path} {change} (sha256 {old_hash} -> {new_hash})"

  - id: protected-binary-modified
    description: A protected system binary was replaced or modified (trojanized binary)
    mitre: T1554
    severity: critical
    match: {event_type: file_change, group: binaries}
    message: "{path} {change} (sha256 {old_hash} -> {new_hash})"

  - id: watched-file-changed
    description: A user-configured watched file changed
    severity: medium
    match: {event_type: file_change, group: custom}
    message: "{path} {change} (sha256 {old_hash} -> {new_hash})"

  # ------------------------------------------------------------------ network
  - id: outbound-port-scan
    description: One process probed many ports on the same host in a short window
    mitre: T1046
    severity: high
    match: {event_type: net_connect}
    threshold: {count: 15, window: 10, group_by: [pid, dst_ip], distinct: dst_port, cooldown: 60}
    message: "{process_name} (pid {pid}) hit {count} distinct ports on {dst_ip} within {window}s"

  - id: outbound-connection-burst
    description: One process opened connections to many distinct endpoints (sweep / beaconing)
    mitre: T1071
    severity: medium
    match: {event_type: net_connect}
    threshold: {count: 50, window: 30, group_by: [pid], distinct: dst, cooldown: 120}
    message: "{process_name} (pid {pid}) connected to {count} distinct endpoints within {window}s"

  - id: outbound-suspicious-port
    description: Outbound connection to a port commonly used by C2 / reverse shells
    mitre: T1571
    severity: medium
    match:
      event_type: net_connect
      dst_port: [4444, 4445, 1337, 31337, 6666, 6667, 6697, 5555, 9001, 9050, 12345, 54321]
    message: "{process_name} (pid {pid}) connected to {dst} (suspicious port)"

  - id: shell-network-connection
    description: A shell process opened a network connection itself (bash /dev/tcp reverse shell)
    mitre: T1059.004
    severity: critical
    match:
      event_type: net_connect
      process_name: [bash, sh, dash, zsh, ksh]
    message: "Shell {process_name} (pid {pid}) connected out to {dst}"

  - id: bind-shell-listener
    description: A shell or netcat-style tool started listening on a port (bind shell)
    mitre: T1571
    severity: high
    match:
      event_type: net_listen
      process_name: [bash, sh, dash, nc, ncat, netcat, nc.openbsd, nc.traditional, socat]
    message: "{process_name} (pid {pid}) is listening on {local_ip}:{local_port}"

# Active response. OFF by default: destructive actions (kill_process, block_ip) are
# logged as "not executed" unless enabled here. See README "Active response safety".
response:
  enabled: false
